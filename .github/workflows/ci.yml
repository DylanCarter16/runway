name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
        env:
          # tsc needs a little over 2 GB (Supabase's typed query strings); Node 20's default heap is about 2 GB.
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run test
      - run: npm run build
        env:
          # next build type-checks too.
          NODE_OPTIONS: --max-old-space-size=4096
