<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline, Runway</title>
    <style>
      :root { --paper: #f6f6f4; --ink: #000000; --graphite: #595959; --link: #000000; --link-line: #eaab00; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #121212; --ink: #f2f2f2; --graphite: #ababab; --link: #fed34c; --link-line: #fed34c; }
      }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: var(--paper); color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box;
      }
      main { max-width: 26rem; }
      h1 { font-size: 21px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: var(--graphite); }
      a { color: var(--link); text-decoration-color: var(--link-line); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't saved on this device. Today and Calendar keep their last copy, so they still open.</p>
      <p><a href="/">Open Today</a> · <a href="/calendar">Open Calendar</a></p>
    </main>
  </body>
</html>
